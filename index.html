<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塵が積もったらゴミ屋敷に決まってる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- 左：年代ナビ（スケッチブックの背表紙イメージ） -->
  <aside class="shelf" id="shelf">
    <div class="shelf-header">
      <img class="shelf-logo" src="images/logo.png" alt="塵が積もったらゴミ屋敷に決まってる いつかの10分ドロとか、他">
      <p class="shelf-credit">Illust: ミズシマ</p>
      <div class="shelf-social">
        <a href="https://x.com/mizushima_lp" target="_blank" rel="noopener" aria-label="X (Twitter)">
          <img src="https://cdn.simpleicons.org/x/96958F" width="14" height="14" alt="X">
        </a>
        <a href="https://www.pixiv.net/users/3341878" target="_blank" rel="noopener" aria-label="pixiv">
          <img src="https://cdn.simpleicons.org/pixiv/96958F" width="14" height="14" alt="pixiv">
        </a>
      </div>
    </div>
    <button class="shelf-toggle" id="shelfToggle" aria-expanded="false" aria-controls="spines">
      <span id="shelfToggleLabel">すべて</span>
      <svg class="shelf-toggle-icon" viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
    </button>
    <nav class="spines" id="spines">
      <!-- JSで年ごとの背表紙を生成 -->
    </nav>
  </aside>

  <!-- 右：メイン -->
  <main class="main">
    <header class="toolbar">
      <div class="filters" id="tagFilters">
        <button class="chip is-active" data-tag="all">すべて</button>
        <button class="chip" data-tag="analog">10分ドロ</button>
        <button class="chip" data-tag="copic">コピック</button>
        <button class="chip" data-tag="digital">デジタル</button>
      </div>
      <div class="count" id="resultCount"></div>
    </header>

    <section class="grid" id="grid" aria-live="polite"></section>

    <div class="sentinel" id="sentinel"></div>
    <p class="empty" id="emptyState" hidden>この条件に一致する作品はまだありません。</p>
  </main>

</div>

<!-- ライトボックス -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="閉じる">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="前へ">&#8249;</button>
  <img class="lb-img" id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="次へ">&#8250;</button>
  <div class="lb-meta">
    <span class="lb-date" id="lbDate"></span>
    <span class="lb-tag" id="lbTag"></span>
    <button class="lb-like" id="lbLike" aria-label="いいね">
      <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.5 1.6 7.3 4.2 5.9c2.2-1.2 4.6-.4 5.8 1.3.4.5.7 1 1 1.5.3-.5.6-1 1-1.5 1.2-1.7 3.6-2.5 5.8-1.3 2.6 1.4 3.2 4.6 1.5 7C18.7 16.65 12 21 12 21Z"/></svg>
      <span id="lbLikeCount">-</span>
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
